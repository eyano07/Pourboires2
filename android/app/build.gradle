plugins {
    id 'com.android.application'
}

// Adresse du serveur proposée au premier lancement (modifiable dans l'appli).
def serverUrl = project.findProperty('serverUrl') ?: 'http://72.62.29.224:8087'
// Signature : clé fournie par les secrets GitHub (sinon clé de test temporaire).
def keystoreFile = System.getenv('KEYSTORE_FILE')

android {
    namespace 'com.chezbiso.pourboires'
    compileSdk 35

    defaultConfig {
        applicationId 'com.chezbiso.pourboires'
        minSdk 24
        targetSdk 35
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName(System.getenv('VERSION_NAME') ?: '1.0')
        buildConfigField 'String', 'DEFAULT_SERVER', "\"${serverUrl}\""
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            if (keystoreFile) {
                storeFile file(keystoreFile)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'pourboires'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystoreFile ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
